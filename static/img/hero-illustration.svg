<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background Shape -->
  <path d="M50,50 L450,40 L440,350 L40,360 Z" fill="url(#grad1)" />
  
  <!-- Document -->
  <rect x="100" y="100" width="200" height="250" rx="5" fill="#fff" stroke="#ddd" stroke-width="2" />
  
  <!-- Document Lines -->
  <line x1="120" y1="130" x2="280" y2="130" stroke="#eee" stroke-width="2" />
  <line x1="120" y1="150" x2="280" y2="150" stroke="#eee" stroke-width="2" />
  <line x1="120" y1="170" x2="280" y2="170" stroke="#eee" stroke-width="2" />
  <line x1="120" y1="190" x2="280" y2="190" stroke="#eee" stroke-width="2" />
  <line x1="120" y1="210" x2="280" y2="210" stroke="#eee" stroke-width="2" />
  <line x1="120" y1="230" x2="280" y2="230" stroke="#eee" stroke-width="2" />
  <line x1="120" y1="250" x2="280" y2="250" stroke="#eee" stroke-width="2" />
  <line x1="120" y1="270" x2="280" y2="270" stroke="#eee" stroke-width="2" />
  <line x1="120" y1="290" x2="280" y2="290" stroke="#eee" stroke-width="2" />
  <line x1="120" y1="310" x2="200" y2="310" stroke="#eee" stroke-width="2" />
  
  <!-- AI Brain -->
  <circle cx="350" cy="150" r="50" fill="#3498db" opacity="0.8" />
  <path d="M320,140 Q350,100 380,140" fill="none" stroke="#fff" stroke-width="3" />
  <path d="M320,160 Q350,200 380,160" fill="none" stroke="#fff" stroke-width="3" />
  <line x1="350" y1="110" x2="350" y2="190" stroke="#fff" stroke-width="3" />
  
  <!-- Connections -->
  <line x1="300" y1="160" x2="320" y2="160" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="300" y1="180" x2="330" y2="170" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="300" y1="200" x2="340" y2="180" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="300" y1="220" x2="340" y2="190" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,3" />
  
  <!-- Blockchain -->
  <rect x="320" y="240" width="40" height="30" rx="3" fill="#2c3e50" />
  <rect x="350" y="260" width="40" height="30" rx="3" fill="#2c3e50" />
  <rect x="380" y="280" width="40" height="30" rx="3" fill="#2c3e50" />
  
  <!-- Chain Links -->
  <line x1="345" y1="255" x2="365" y2="275" stroke="#3498db" stroke-width="3" />
  <line x1="375" y1="275" x2="395" y2="295" stroke="#3498db" stroke-width="3" />
  
  <!-- Grade Badge -->
  <circle cx="410" cy="140" r="25" fill="#2ecc71" />
  <text x="396" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">A+</text>
  
  <!-- BTEC Text -->
  <text x="140" y="90" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">BTEC</text>
  <text x="220" y="90" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3498db">تقييم</text>
</svg>
