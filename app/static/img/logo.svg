<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3e90"/>
      <stop offset="100%" stop-color="#7057d3"/>
    </linearGradient>
    <linearGradient id="gradSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00aa9e"/>
      <stop offset="100%" stop-color="#00dacb"/>
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#ffac75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Circle Background -->
  <circle cx="100" cy="100" r="90" fill="url(#gradPrimary)" filter="url(#shadow)"/>
  
  <!-- BTEC Character in Arabic style -->
  <g transform="translate(50, 65) scale(1.1)">
    <!-- B -->
    <path d="M10,0 L25,0 Q40,0 40,15 Q40,25 30,30 Q45,35 45,50 Q45,65 30,65 L10,65 Z" fill="url(#gradSecondary)" stroke="white" stroke-width="2"/>
    <path d="M20,10 L25,10 Q30,10 30,15 Q30,20 25,20 L20,20 Z" fill="white"/>
    <path d="M20,40 L25,40 Q30,40 30,45 Q30,50 25,50 L20,50 Z" fill="white"/>
    
    <!-- T -->
    <path d="M55,0 L85,0 L85,10 L75,10 L75,65 L65,65 L65,10 L55,10 Z" fill="url(#gradAccent)" stroke="white" stroke-width="2"/>
    
    <!-- E -->
    <path d="M95,0 L125,0 L125,10 L105,10 L105,25 L120,25 L120,35 L105,35 L105,55 L125,55 L125,65 L95,65 Z" fill="url(#gradSecondary)" stroke="white" stroke-width="2"/>
    
    <!-- C -->
    <path d="M135,0 Q150,0 155,10 Q160,20 160,30 L150,35 Q150,25 145,20 Q140,15 135,15 Q130,15 125,20 Q120,25 120,35 Q120,45 125,50 Q130,55 135,55 Q140,55 145,50 Q150,45 150,40 L160,45 Q160,50 155,55 Q150,65 135,65 Q120,65 112.5,57.5 Q105,50 105,35 Q105,20 112.5,10 Q120,0 135,0 Z" fill="url(#gradAccent)" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- Stars/Sparkles -->
  <g fill="white">
    <circle cx="60" cy="45" r="2"/>
    <circle cx="140" cy="45" r="2"/>
    <circle cx="50" cy="155" r="2"/>
    <circle cx="150" cy="155" r="2"/>
    <circle cx="30" cy="100" r="3"/>
    <circle cx="170" cy="100" r="3"/>
    
    <path d="M40,60 L45,62 L43,57 L47,54 L42,54 L40,49 L38,54 L33,54 L37,57 L35,62 Z" fill="white" opacity="0.7"/>
    <path d="M160,60 L165,62 L163,57 L167,54 L162,54 L160,49 L158,54 L153,54 L157,57 L155,62 Z" fill="white" opacity="0.7"/>
    <path d="M100,15 L103,22 L110,22 L105,27 L107,34 L100,30 L93,34 L95,27 L90,22 L97,22 Z" fill="url(#gradAccent)" opacity="0.8"/>
  </g>
</svg>
