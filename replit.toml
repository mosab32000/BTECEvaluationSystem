# سير العمل الرئيسي لتشغيل تطبيق نظام تقييم BTEC
[run]
command = ["./run_btec_server.sh"]
language = "python3"

# تكوين سير عمل للتطبيق
[workflows.btec-app]
run = "python run_flask_server.py"
language = "python3"

[env]
PYTHONUNBUFFERED = "1"
PORT = "5000"
FLASK_APP = "run_flask_server.py"
FLASK_ENV = "development"

[dev]
port = 5000
